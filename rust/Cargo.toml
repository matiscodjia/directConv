[package]
name = "directconv-native"
version = "0.1.0"
edition = "2021"
description = "PyO3 bindings for frugal_ml's cross_correlate2d, run on the host to compare against numpy"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# Cœur seul + stockage tas (`alloc`) : pas de `std`, donc ni `regex` ni `asm`
# (sonde de benchmark embarquée) tirés côté hôte.
frugal_ml = { path = "../../../projects/frugal_ml", default-features = false, features = ["alloc"] }
pyo3 = { version = "0.29", features = ["extension-module"] }
numpy = "0.29"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
